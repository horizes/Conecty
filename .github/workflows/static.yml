name: Validar e publicar Conecty Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir integridade e segurança dos arquivos públicos
        run: node ci/verify-public.mjs .
      - name: Preparar somente o conteúdo público validado
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const manifest=JSON.parse(fs.readFileSync('release-manifest.json','utf8'));
          fs.mkdirSync('_site',{recursive:true});
          for(const {path:name} of [...manifest.files,{path:'release-manifest.json'}]){
            const target=path.join('_site',name);fs.mkdirSync(path.dirname(target),{recursive:true});fs.copyFileSync(name,target);
          }
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
