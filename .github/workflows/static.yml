name: Validar e publicar Conecty Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validar conteúdo público
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0
      - name: Conferir integridade e segurança dos arquivos públicos
        run: node ci/verify-public.mjs .
      - name: Conferir higiene do repositório
        run: node ci/check-hygiene.mjs .
      - name: Conferir migrations
        run: node ci/check-migrations.mjs .

  publish:
    name: Publicar no GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0
      - name: Preparar somente o conteúdo público validado
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const manifest=JSON.parse(fs.readFileSync('release-manifest.json','utf8'));
          fs.mkdirSync('_site',{recursive:true});
          for(const {path:name} of [...manifest.files,{path:'release-manifest.json'}]){
            const target=path.join('_site',name);fs.mkdirSync(path.dirname(target),{recursive:true});fs.copyFileSync(name,target);
          }
          NODE
      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Empacotar site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
